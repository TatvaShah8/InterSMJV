<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>INTER SMJV 2026 — Inter-Hostel Sports & Cultural Festival, Vadodara</title>
  <meta name="description" content="INTER SMJV 2026: Ten sports, eight hostels, five days of sport and culture at the SMJV Hostel Branch, Vadodara. 14–18 December 2026.">
  <meta name="theme-color" content="#1856FF">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="inter_smjv_2026_vadodara_logo.svg">

  <!-- Google Web Fonts (Plus Jakarta Sans for Primary/Display, JetBrains Mono for Data/Timings, Noto Sans Gujarati for Cultural Accent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#1856FF',
              hover: '#0E44E6',
              light: '#EEF3FF',
              glow: 'rgba(24, 86, 255, 0.35)',
            },
            secondary: {
              DEFAULT: '#3A344E',
              dark: '#242033',
              light: '#534B6E',
            },
            success: {
              DEFAULT: '#07CA6B',
              glow: 'rgba(7, 202, 107, 0.3)',
            },
            warning: {
              DEFAULT: '#E89558',
              glow: 'rgba(232, 149, 88, 0.3)',
            },
            danger: {
              DEFAULT: '#EA2143',
              glow: 'rgba(234, 33, 67, 0.3)',
            },
            surface: {
              DEFAULT: '#FFFFFF',
              glass: 'rgba(255, 255, 255, 0.08)',
              glassLight: 'rgba(255, 255, 255, 0.85)',
            },
            brandText: {
              DEFAULT: '#141414',
              muted: '#71717A',
              sub: '#A1A1AA',
            },
            midnight: {
              DEFAULT: '#0A0E23',
              deep: '#060817',
              card: '#101533',
              cardHover: '#161D45',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            gu: ['"Noto Sans Gujarati"', 'sans-serif'],
          },
          animation: {
            'marquee': 'marquee 32s linear infinite',
            'pulse-subtle': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Glassmorphism Foundations & Liquid Glass Depth Effects -->
  <style>
    /* Liquid Glassmorphic Surface System */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .liquid-glass-card {
      background: rgba(16, 21, 51, 0.68);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-glass-card:hover {
      border-color: rgba(24, 86, 255, 0.45);
      box-shadow: 0 16px 44px 0 rgba(0, 0, 0, 0.55), 0 0 20px rgba(24, 86, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
    html[data-theme="light"] .liquid-glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid rgba(20, 20, 20, 0.1);
      box-shadow: 0 10px 30px rgba(20, 20, 20, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    html[data-theme="light"] .liquid-glass-card:hover {
      border-color: rgba(24, 86, 255, 0.5);
      box-shadow: 0 16px 40px rgba(24, 86, 255, 0.12);
    }

    /* Primary Interaction Signals */
    .btn-primary-glass {
      background: #1856FF;
      color: #FFFFFF;
      box-shadow: 0 6px 20px rgba(24, 86, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary-glass:hover {
      background: #0E44E6;
      box-shadow: 0 8px 26px rgba(24, 86, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }
    .btn-primary-glass:active {
      transform: translateY(0);
    }

    /* Subtle custom scrollbars */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(24, 86, 255, 0.4);
      border-radius: 999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(24, 86, 255, 0.7);
    }

    /* Clean Print Format for Tournament Rulebook */
    @media print {
      header, footer, nav, button, .no-print {
        display: none !important;
      }
      body {
        background: #fff !important;
        color: #141414 !important;
      }
      .liquid-glass-card, div {
        box-shadow: none !important;
        border-color: #e5e7eb !important;
        background: #fff !important;
      }
    }
  </style>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0A0E23] text-[#F5F7FF] antialiased min-h-screen font-sans selection:bg-[#1856FF] selection:text-white">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Fallback if JavaScript is disabled -->
  <noscript>
    <div style="padding: 40px; text-align: center; color: #141414; background: #FFFFFF; font-family: sans-serif;">
      <h2>JavaScript Required</h2>
      <p>Please enable JavaScript to view the INTER SMJV 2026 Portal.</p>
    </div>
  </noscript>

  <!-- Application Data Model -->
  <script src="data.js"></script>

  <!-- Modern React Application Component -->
  <script type="text/babel" src="app.jsx"></script>

</body>
</html>
